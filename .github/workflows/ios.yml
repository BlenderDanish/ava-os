# AVA OS for iPhone / iPad.
#
# build       every push that touches the app: compiles for the simulator with
#             no signing. Needs no Apple account; this is the compile check.
# testflight  run by hand (Actions > iOS > Run workflow, tick "Upload to
#             TestFlight"): archives, signs and uploads to App Store Connect.
#
# The testflight job needs these repository secrets
# (Settings > Secrets and variables > Actions):
#   ASC_KEY_ID      App Store Connect API key ID          (10 characters)
#   ASC_ISSUER_ID   App Store Connect issuer ID           (a UUID)
#   ASC_KEY_P8      the full text of the AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID   the Apple Developer team ID           (10 characters)
# and optionally the repository variable
#   BUNDLE_ID       defaults to the one in ipad/project.yml
# The API key must have the Admin role so Xcode can create the signing
# certificate and provisioning profile by itself.
name: iOS

on:
  push:
    paths:
      - "ipad/**"
      - "src/engine.*"
      - "src/analysis.*"
      - "src/dsp.h"
      - "src/rfft.h"
      - "src/ringbuf.h"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload to TestFlight"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile (simulator, unsigned)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ipad
        run: xcodegen generate
      - name: Build
        working-directory: ipad
        run: |
          set -o pipefail
          xcodebuild build \
            -project AVAOS.xcodeproj -scheme AVAOS \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "(error|warning):|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ipad/build.log

  testflight:
    name: Archive and upload to TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: build
    runs-on: macos-15
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are set
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set"; missing=1; fi
          done
          exit $missing
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ipad
        run: xcodegen generate
      - name: Write the App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Archive
        working-directory: ipad
        run: |
          set -o pipefail
          EXTRA=()
          if [ -n "$BUNDLE_ID" ]; then EXTRA+=("PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID"); fi
          xcodebuild archive \
            -project AVAOS.xcodeproj -scheme AVAOS \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AVAOS.xcarchive" \
            -derivedDataPath build/dd \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${EXTRA[@]}" \
            | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
      - name: Upload to App Store Connect
        working-directory: ipad
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AVAOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee export.log
          grep -q "EXPORT SUCCEEDED" export.log
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ipad/archive.log
            ipad/export.log
